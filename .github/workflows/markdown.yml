name: Check Markdown links

on:
  push:

jobs:
  markdown-link-check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7.0.1
    - uses: tcort/github-action-markdown-link-check@v1.1.2

  markdown-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
      - uses: DavidAnson/markdownlint-cli2-action@v25
        with:
          globs: '**/*.md'
